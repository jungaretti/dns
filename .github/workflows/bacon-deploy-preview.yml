name: Preview DNS Records

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: jungaretti/bacon-deploy-action@v3
        name: Preview jungaretti.com
        with:
          api-key: ${{ secrets.PORKBUN_API_KEY }}
          secret-key: ${{ secrets.PORKBUN_SECRET_KEY }}
          config: dns/jungaretti.com.yml
          mode: dry-run
      - uses: jungaretti/bacon-deploy-action@v3
        name: Preview jamesungaretti.com
        with:
          api-key: ${{ secrets.PORKBUN_API_KEY }}
          secret-key: ${{ secrets.PORKBUN_SECRET_KEY }}
          config: dns/jamesungaretti.com.yml
          mode: dry-run
