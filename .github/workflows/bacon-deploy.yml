name: Deploy DNS Records

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy ${{ matrix.domain }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      matrix:
        domain:
          - jungaretti.com
          - jamesungaretti.com
    steps:
      - uses: actions/checkout@v7
      - uses: jungaretti/bacon-deploy-action@v3
        with:
          api-key: ${{ secrets.PORKBUN_API_KEY }}
          secret-key: ${{ secrets.PORKBUN_SECRET_KEY }}
          config: dns/${{ matrix.domain }}.yml
          mode: force
